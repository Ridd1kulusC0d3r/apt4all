name: atualizar-dados

on:
  schedule:
    - cron: "0 6 * * 1"   # toda segunda, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar fontes e reconstruir o Atlas
        run: |
          python ferramentas/atlas/construir_dados.py --baixar
          python ferramentas/atlas/mapa_hex.py
          python ferramentas/ransomware/construir_matriz.py --baixar
          python ferramentas/recursos/gerar_listas.py
      - name: Testes
        run: python -m unittest discover -s testes -v
      - name: Resumo
        run: cat dados/gerados/resumo.md | head -20 >> "$GITHUB_STEP_SUMMARY"
      - name: Abrir PR com a atualização
        uses: peter-evans/create-pull-request@v6
        with:
          branch: dados/atualizacao-semanal
          commit-message: "dados: atualização semanal das fontes"
          title: "Dados: atualização semanal das fontes"
          body: |
            Atualização automática de MISP Galaxy, MITRE ATT&CK, planilha APT Groups and Operations, EternalLiberty, APTnotes e Ransomware Tool Matrix.
            Os testes passaram. Revise `dados/gerados/resumo.md` (contagem por país) antes de aceitar.
          labels: dados
          delete-branch: true
