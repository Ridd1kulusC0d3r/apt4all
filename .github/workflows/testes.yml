name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    # Python 3.9 não está disponível no runner Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Testes (só biblioteca padrão)
        run: python -W error::ResourceWarning -m unittest discover -s testes -v

  campanhas-navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar navegador de testes
        run: |
          pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Campanhas no desktop e no celular
        env:
          CAMPANHAS_SCREENSHOTS: qa/campanhas
        run: python testes/campanhas_navegador.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campanhas-layout
          path: qa/campanhas
          if-no-files-found: ignore

  integracao-tce:
    # confere que o sinal gerado continua no formato que o TCE aceita
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o TCE
        run: pip install "git+https://github.com/Ridd1kulusC0d3r/Cyber-Threat-Context-Modeling"
      - name: Teste de integração
        run: python -m unittest discover -s testes -p "test_ponte_tce.py" -v
