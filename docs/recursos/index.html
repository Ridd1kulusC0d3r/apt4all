<style>
.pg{padding-bottom:60px}
h1{margin:34px 0 10px}
.barra{position:sticky;top:0;z-index:5;background:var(--paper);padding-block:12px;display:grid;gap:10px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.barra input{width:100%;font:15px var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);padding:8px 2px;border-radius:0;outline:none}
.barra input:focus{border-bottom-color:var(--signal)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink-2);padding:5px 9px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip b{font-weight:600;color:var(--ink-3)}.chip[aria-pressed="true"] b{color:inherit}
.grupo{margin-top:34px}
.grupo h2{margin:0}
.grupo p.d{margin:2px 0 12px;color:var(--ink-3);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.card{padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.card.dest{box-shadow:inset 3px 0 0 var(--signal)}
.card a.n{font-weight:600;color:var(--ink);word-break:break-word}
.card a.n:hover{color:var(--signal)}
.card p{margin:0;color:var(--ink-2);font-size:14px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);padding:1px 6px;color:var(--ink-3)}
.tag.leg,.tag.nov{border-color:var(--warn);color:var(--warn)}
.tag.usr{border-color:var(--signal);color:var(--signal)}
.vazio{padding:40px;text-align:center;color:var(--ink-3);font:13px var(--mono)}
.aviso{margin:0 0 12px}
</style>

 en:{rec:"RESOURCES",tit:"Resources",sub:"Bilingual curation of CTI, APT and malware resources. Legacy links are flagged, with the replacement alongside. To suggest a resource, edit recursos/recursos.json on GitHub and open a PR.",ph:"Search by name or description…",todos:"all",dest:"★ start here",ativos:"active only",gratis:"free only",usuario:"original list",fUsuario:"original list only",fNovo:"new only",novo:"new",vazio:"Nothing matches these filters.",tipo:{gratuito:"free",pago:"paid",registro:"sign-up",freemium:"freemium"},legado:"legacy",aviso:"Live malware. Download and open only in an isolated lab."}};
